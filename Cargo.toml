[workspace]
resolver = "2"
members = [
  "crates/gate-domain",
  "crates/gate-app",
  "crates/gate-sys",
  "crates/gate-infra",
  "crates/gate-fake-mcp",
  "crates/gate-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["Kien Phan"]
repository = "https://github.com/kienpt91/mcp-remote-gate"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
