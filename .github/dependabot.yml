version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # a new version is proposed only after it has been published for 7 days
    cooldown:
      default-days: 7
    ignore:
      # libc 1.0 is still in alpha; stay on 0.2 until it is released
      - dependency-name: "libc"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
