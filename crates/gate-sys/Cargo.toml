[package]
name = "gate-sys"
description = "The only crate of mcp-remote-gate with unsafe code: process groups, resource limits and signals."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# Not `workspace = true`: this crate may not inherit `unsafe_code = "forbid"`. Every unsafe block
# needs a SAFETY comment, and the architecture test allows unsafe code in this crate only.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
libc = "=0.2.190"
